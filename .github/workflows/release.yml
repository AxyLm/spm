name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: pnpm version "${{ inputs.release_type }}" --no-git-tag-version

      - name: Read release metadata
        id: meta
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v$VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          node -e 'const pkg = require("./package.json"); const tag = process.env.GITHUB_REF_NAME; if (`v${pkg.version}` !== tag) { console.error(`Tag ${tag} does not match package version v${pkg.version}`); process.exit(1) }'

      - name: Verify tag commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tag commit $GITHUB_SHA is not contained in origin/main"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit version bump and create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git add package.json pnpm-lock.yaml
          git commit -m "chore(release): ${{ steps.meta.outputs.tag }}"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "${{ steps.meta.outputs.tag }}"

      - name: Publish to npm
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            pnpm publish
          else
            pnpm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version bump and tag
        if: github.event_name == 'workflow_dispatch'
        run: git push origin HEAD:main --follow-tags

      - name: Create GitHub release
        run: gh release create "${{ steps.meta.outputs.tag }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
